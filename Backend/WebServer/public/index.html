<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>User Count | My Web Server</title>
  </head>

  <body>
    <main class="count-card">
      <header>
        <p class="tagline">DATABASE OVERVIEW</p>
        <h1>Welcome to my web server!</h1>
        <p>Here you can see how many users are saved in the database.</p>
      </header>

      <div class="count-box">
        <p class="count-label">Total users</p>
        <p id="user-count">...</p>
      </div>

      <p class="note">Data comes from the /user-count route</p>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
