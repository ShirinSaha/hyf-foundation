<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hogwarts House Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Hogwarts House Generator</h1>
      <p>Discover which Hogwarts house you belong to!</p>

      <input type="text" id="nameInput" placeholder="Enter your name" />

      <button id="generateBtn">Find My House</button>

      <h2 id="result"></h2>

      <button id="tryAgainBtn" hidden>Try Again</button>

      <p id="description"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
